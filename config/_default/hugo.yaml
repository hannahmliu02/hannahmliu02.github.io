# Hugo configuration. The site uses its own theme in `layouts/` and `assets/`.
# Hugo documentation: https://gohugo.io/getting-started/configuration/

title: 'Hannah Liu'
baseURL: 'https://hannahmliu.com/'

defaultContentLanguage: en
hasCJKLanguage: false
removePathAccents: true

enableRobotsTXT: true
enableEmoji: true
summaryLength: 30
disableKinds: [taxonomy, term, RSS]
ignoreFiles: [".ipynb_checkpoints$", "_cache$"]

outputs:
  home: [HTML]
  section: [HTML]
  page: [HTML]

markup:
  goldmark:
    renderer:
      # Allow the small amount of inline HTML used in page content
      unsafe: true
    parser:
      attribute:
        block: true
        title: true
  highlight:
    lineNos: false

imaging:
  resampleFilter: lanczos
  quality: 85
  anchor: smart
